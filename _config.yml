remote_theme: simplonco/simplonline-ressources-jekyll-theme

title: "Git/GitHub 3 : Remote"
description: Partager ses dépôts à l'aide de dépôts distants comme ceux proposés par GitHub
github_org: simplonco
lang: fr

show_toc: true

readme_index:
  with_frontmatter: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

plugins:
  - jekyll-readme-index
  - jekyll-remote-theme
  - jekyll-stepper
